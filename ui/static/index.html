<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Agent v2</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:rgba(255,255,255,.08);--text:#e6edf3;--muted:#768390;--dim:#484f58;--purple:#a78bfa;--teal:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:13px;font-weight:600}
#dot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s;flex-shrink:0}
#dot.running{background:#4ade80;animation:pulse 1.4s ease-in-out infinite}
#dot.done{background:var(--teal)}#dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#stxt{font-size:11px;color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:250px 1fr 280px;height:calc(100vh - 44px);overflow:hidden}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.panel:last-child{border-right:none;border-left:1px solid var(--border)}
.ptitle{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px 6px;flex-shrink:0}
textarea{margin:0 10px 8px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;padding:9px 11px;font-size:12px;resize:none;outline:none;font-family:inherit;line-height:1.5;height:100px}
textarea:focus{border-color:rgba(255,255,255,.2)}
.opt{display:flex;align-items:center;gap:7px;padding:0 10px 8px;font-size:11px;color:var(--muted);cursor:pointer}
.runbtn{margin:0 10px 14px;padding:8px;background:#238636;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;width:calc(100% - 20px)}
.runbtn:hover{background:#2ea043}.runbtn:disabled{background:var(--bg3);color:var(--dim);cursor:not-allowed}
.cards{display:flex;flex-direction:column;gap:7px;padding:0 10px 10px}
.card{border:1px solid var(--border);border-radius:7px;padding:9px 11px;transition:border-color .2s,background .2s}
.card.active{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.04)}
.card.done{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.03)}
.card.error{border-color:rgba(248,113,113,.4)}
.card .nm{font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px}
.card .sb{font-size:10px;color:var(--muted);margin-top:2px}
.badge{font-size:9px;padding:1px 6px;border-radius:9px;font-weight:500}
.badge.idle{background:var(--bg3);color:var(--dim)}.badge.running{background:rgba(167,139,250,.2);color:var(--purple)}
.badge.done{background:rgba(52,211,153,.15);color:var(--teal)}.badge.error{background:rgba(248,113,113,.15);color:var(--red)}
.iter-badge{font-size:10px;color:var(--muted);padding:4px 10px;text-align:center}
#feed{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:2px}
.fi{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.55;padding:3px 0}
.fi-ico{font-size:12px;flex-shrink:0;width:16px;text-align:center;margin-top:1px}
.fi-c{flex:1;min-width:0}
.ftag{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-right:7px}
.ftag.architect{color:var(--purple)}.ftag.coder{color:var(--teal)}.ftag.tester{color:var(--blue)}
.ftag.reviewer{color:var(--amber)}.ftag.pipeline{color:var(--muted)}.ftag.researcher{color:var(--purple)}
.ftag.writer{color:var(--teal)}.ftag.editor{color:var(--amber)}.ftag.planner{color:var(--blue)}
.fb{color:var(--muted);word-break:break-word;white-space:pre-wrap}
.fb.thought{color:var(--text)}.fb.streaming{color:var(--text)}.fb.tool{color:var(--amber);font-family:'Menlo','Consolas',monospace;font-size:11px}
.fb.result{color:var(--dim);font-family:'Menlo','Consolas',monospace;font-size:10.5px}
.fb.done{color:#4ade80}.fb.iter{color:var(--blue)}.fb.error{color:var(--red)}
.cursor{display:inline-block;width:7px;height:12px;background:var(--text);vertical-align:middle;animation:blink .8s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.empty{color:var(--dim);font-size:12px;margin:auto;text-align:center;padding:30px 16px}
.tab{background:none;border:none;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;flex:1;text-align:center}
.tab:hover{color:var(--text)}.tab.active{color:var(--text);border-bottom-color:var(--purple)}
.fitem{display:flex;gap:7px;align-items:center;padding:4px 7px;border-radius:5px;cursor:pointer;font-size:11px;transition:background .12s}
.fitem:hover{background:var(--bg3)}.fitem .fn{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fs{color:var(--dim);font-size:9px;flex-shrink:0}
.fitem.new-file{animation:hl .8s ease-out}@keyframes hl{0%{background:rgba(52,211,153,.25)}100%{background:transparent}}
#writing-bar{display:none;padding:6px 10px;font-size:11px;border-bottom:1px solid var(--border);background:rgba(52,211,153,.06);align-items:center;gap:8px}
#writing-bar.on{display:flex}
.wpulse{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1s infinite;flex-shrink:0}
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:20px}
#viewer.open{display:flex}
#vbox{background:var(--bg2);border:1px solid var(--border);border-radius:10px;max-width:740px;width:100%;max-height:82vh;display:flex;flex-direction:column}
#vhdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
#vpath{font-size:12px;font-weight:600}#vclose{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
#vcontent{overflow-y:auto;padding:14px;font-family:'Menlo','Consolas',monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
</head>
<body>
<header>
  <div id="dot"></div><h1>Multi-Agent Pipeline v2</h1><span id="stxt">idle</span>
</header>
<div class="layout">
  <!-- LEFT -->
  <div class="panel" style="background:var(--bg2)">
    <div class="ptitle">Task</div>
    <textarea id="tinput" placeholder="Describe what to build..."></textarea>
    <label class="opt"><input type="checkbox" id="cclean"> Clean workspace</label>
    <label class="opt"><input type="checkbox" id="cplanner"> Planner mode</label>
    <button class="runbtn" id="rbtn" onclick="startRun()">Run pipeline</button>
    <div id="route-badge" style="margin:0 10px 8px;padding:5px 10px;border-radius:6px;font-size:11px;background:var(--bg3);color:var(--muted);display:none"></div>
    <div class="ptitle">Coding</div>
    <div class="cards">
      <div class="card" id="c-architect"><div class="nm">Architect <span class="badge idle" id="b-architect">idle</span></div><div class="sb">Plans structure</div></div>
      <div class="card" id="c-coder"><div class="nm">Coder <span class="badge idle" id="b-coder">idle</span></div><div class="sb">Writes code</div></div>
      <div class="card" id="c-tester"><div class="nm">Tester <span class="badge idle" id="b-tester">idle</span></div><div class="sb">Runs tests</div></div>
      <div class="card" id="c-reviewer"><div class="nm">Reviewer <span class="badge idle" id="b-reviewer">idle</span></div><div class="sb">Reviews code</div></div>
    </div>
    <div class="ptitle">Research</div>
    <div class="cards">
      <div class="card" id="c-researcher"><div class="nm">Researcher <span class="badge idle" id="b-researcher">idle</span></div><div class="sb">Searches web</div></div>
      <div class="card" id="c-writer"><div class="nm">Writer <span class="badge idle" id="b-writer">idle</span></div><div class="sb">Writes document</div></div>
      <div class="card" id="c-editor"><div class="nm">Editor <span class="badge idle" id="b-editor">idle</span></div><div class="sb">Reviews quality</div></div>
    </div>
    <div id="iter-info" class="iter-badge"></div>
  </div>

  <!-- CENTER: Feed -->
  <div class="panel" style="background:var(--bg)">
    <div class="ptitle">Live feed</div>
    <div id="feed"><div class="empty" id="emsg">Run a task to see activity.</div></div>
  </div>

  <!-- RIGHT: Workspace / History / Plugins -->
  <div class="panel" style="background:var(--bg2)">
    <div style="display:flex;gap:0;border-bottom:1px solid var(--border)">
      <button class="tab active" id="tab-files" onclick="showTab('files')">Workspace</button>
      <button class="tab" id="tab-history" onclick="showTab('history')">History</button>
      <button class="tab" id="tab-plugins" onclick="showTab('plugins')">Plugins</button>
    </div>
    <div id="writing-bar"><div class="wpulse"></div><span id="wname" style="color:var(--teal);font-weight:500"></span><span style="color:var(--dim)">writing...</span></div>
    <div id="pane-files" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div id="flist" style="overflow-y:auto;flex-shrink:0;max-height:40%"></div>
      <div id="codepreview" style="display:none;flex:1;min-height:0;border-top:1px solid var(--border);overflow-y:auto">
        <div id="cp-hdr" style="padding:6px 10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);position:sticky;top:0;background:var(--bg2)"></div>
        <pre id="cp-code" style="padding:4px 10px 10px;font-family:'Menlo','Consolas',monospace;font-size:11px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;margin:0"></pre>
      </div>
    </div>
    <div id="pane-history" style="flex:1;overflow-y:auto;display:none"><div id="hlist"></div></div>
    <div id="pane-plugins" style="flex:1;overflow-y:auto;display:none"><div id="plist"></div><button class="runbtn" style="margin:8px 10px;width:auto;font-size:11px;padding:5px 12px" onclick="reloadPlugins()">Reload</button></div>
  </div>
</div>

<!-- File viewer modal -->
<div id="viewer" onclick="if(event.target===this)closeV()">
  <div id="vbox">
    <div id="vhdr"><span id="vpath"></span><button id="vclose" onclick="closeV()">X</button></div>
    <pre id="vcontent"></pre>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let ws, streamRow=null, lastWritePath=null;
const AGENTS=["planner","architect","coder","tester","reviewer","researcher","writer","editor"];
const ICONS={agent_start:"*",token:"",thought:"T",tool_call:"!",tool_result:"<",agent_done:"V",iteration:"~",pipeline_done:"OK",error:"X"};
const BCLS={agent_start:"",thought:"thought",tool_call:"tool",tool_result:"result",agent_done:"done",iteration:"iter",pipeline_done:"done",error:"error"};

// ── WebSocket ────────────────────────────────────────────────────────────────
function connect(){
  ws=new WebSocket("ws://"+location.host+"/ws");
  ws.onmessage=function(e){handle(JSON.parse(e.data))};
  ws.onclose=function(){setTimeout(connect,2000)};
}
connect();

// ── Event handler ────────────────────────────────────────────────────────────
function handle(ev){
  var agent=ev.agent, type=ev.type, data=ev.data;

  // Write file tracking
  if(type==="tool_call"&&data.tool==="write_file"){
    lastWritePath=(data.args&&data.args.path)||"";
    document.getElementById("writing-bar").classList.add("on");
    document.getElementById("wname").textContent=lastWritePath;
    showTab("files");
  }
  if(type==="tool_result"&&lastWritePath&&(data.tool==="write_file"||(data.result||"").indexOf("Written")===0)){
    document.getElementById("writing-bar").classList.remove("on");
    var wrote=lastWritePath;
    lastWritePath=null;
    refreshFiles(wrote);
    if(wrote)setTimeout(function(){showPreview(wrote)},300);
  }

  // Agent cards
  if(type==="agent_start"){
    if(data.stage==="router"){
      var b=document.getElementById("route-badge");
      b.style.display="block";
      b.textContent="-> "+(data.task_type||"").toUpperCase()+": "+(data.reason||"");
    }
    setCard(agent,"active","running");
    refreshFiles();
  }
  if(type==="agent_done"){setCard(agent,"done","done");refreshFiles();}
  if(type==="error"&&agent!=="pipeline")setCard(agent,"error","error");
  if(type==="tool_result"&&!lastWritePath)refreshFiles();
  if(type==="iteration"){
    document.getElementById("iter-info").textContent="Iteration "+(data.n||"")+" — fixing issues";
    setCard("coder","","idle");setCard("tester","","idle");setCard("reviewer","","idle");
  }
  if(type==="pipeline_done"){
    setStatus("done","done");
    document.getElementById("rbtn").disabled=false;
    refreshFiles();
  }

  // Streaming tokens
  if(type==="token"){
    if(!streamRow)streamRow=addRow(agent,"token","","streaming");
    var body=streamRow.querySelector(".fb");
    body.textContent=body.textContent.replace("_","")+data.chunk+"_";
    document.getElementById("feed").scrollTop=99999;
    return;
  }
  if(type==="thought"&&streamRow){
    streamRow.querySelector(".fb").textContent=data.text||"";
    streamRow.querySelector(".fb").className="fb thought";
    streamRow=null;
    return;
  }
  if(type!=="token"){streamRow=null;addEventRow(agent,type,data);}
}

// ── Feed ─────────────────────────────────────────────────────────────────────
function addEventRow(agent,type,data){
  var body="";
  if(type==="agent_start")body=(data.task||"").slice(0,120);
  else if(type==="thought")body=data.text||"";
  else if(type==="tool_call"){var a=JSON.stringify(data.args||{});body=(data.tool||"")+"("+a.slice(0,160)+(a.length>160?"...":"")+")";}
  else if(type==="tool_result")body=(data.result||"").slice(0,250);
  else if(type==="agent_done")body=(data.output||"").slice(0,200)+(data.verdict?" · "+data.verdict:"");
  else if(type==="iteration")body="Revision "+(data.n||"")+" — "+(data.reason||"");
  else if(type==="pipeline_done")body="Done · verdict: "+(data.final_verdict||"?");
  else if(type==="error")body=data.message||"";
  addRow(agent,type,body,BCLS[type]||"");
}
function addRow(agent,type,body,cls){
  var feed=document.getElementById("feed");
  var em=document.getElementById("emsg");if(em)em.remove();
  var row=document.createElement("div");
  row.className="fi";
  row.innerHTML='<div class="fi-ico">'+(ICONS[type]||".")+'</div><div class="fi-c"><span class="ftag '+agent+'">'+agent+'</span><span class="fb '+cls+'">'+esc(body)+'</span></div>';
  feed.appendChild(row);
  feed.scrollTop=feed.scrollHeight;
  return row;
}

// ── Cards ────────────────────────────────────────────────────────────────────
function setCard(agent,cc,bc){
  var card=document.getElementById("c-"+agent);
  var badge=document.getElementById("b-"+agent);
  if(card)card.className="card "+(cc||"");
  if(badge){badge.className="badge "+(bc||"idle");badge.textContent=bc||"idle";}
}
function setStatus(s,t){document.getElementById("dot").className=s;document.getElementById("stxt").textContent=t;}

// ── Run ──────────────────────────────────────────────────────────────────────
function startRun(){
  var task=document.getElementById("tinput").value.trim();
  var clean=document.getElementById("cclean").checked;
  if(!task)return;
  document.getElementById("rbtn").disabled=true;
  document.getElementById("feed").innerHTML="";
  document.getElementById("flist").innerHTML="";
  document.getElementById("iter-info").textContent="";
  document.getElementById("codepreview").style.display="none";
  var rb=document.getElementById("route-badge");if(rb)rb.style.display="none";
  AGENTS.forEach(function(a){setCard(a,"","idle");});
  setStatus("running","running...");
  streamRow=null;lastWritePath=null;
  var planner=document.getElementById("cplanner").checked;
  var endpoint=planner?"/run/planner":"/run";
  fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:task,clean:clean})});
}

// ── Files ────────────────────────────────────────────────────────────────────
function refreshFiles(newFile){
  fetch("/files").then(function(r){return r.json()}).then(function(data){
    var list=document.getElementById("flist");
    var prev={};
    list.querySelectorAll(".fitem").forEach(function(r){prev[r.getAttribute("data-p")]=1;});
    list.innerHTML="";
    if(!data.files||!data.files.length){list.innerHTML='<div style="padding:10px 14px;font-size:11px;color:var(--dim)">No files yet</div>';return;}
    var exts={py:"P",md:"M",txt:"T",js:"J",html:"H",css:"C",json:"{}",yaml:"Y"};
    data.files.forEach(function(f){
      var ext=f.path.split(".").pop()||"";
      var row=document.createElement("div");
      row.className="fitem";
      row.setAttribute("data-p",f.path);
      if(newFile===f.path||!prev[f.path])row.classList.add("new-file");
      row.onclick=function(){openFile(f.path)};
      row.innerHTML='<span style="font-size:10px;color:var(--muted);width:16px;text-align:center">'+(exts[ext]||"F")+'</span><span class="fn">'+esc(f.path)+'</span><span class="fs">'+fmt(f.bytes)+'</span>';
      list.appendChild(row);
    });
  });
}
function showPreview(path){
  fetch("/files/"+path.replace(/\\/g,"/")).then(function(r){return r.json()}).then(function(data){
    document.getElementById("codepreview").style.display="block";
    document.getElementById("cp-hdr").textContent=path;
    document.getElementById("cp-code").textContent=data.content||"(empty)";
  }).catch(function(){});
}
function openFile(path){
  fetch("/files/"+path.replace(/\\/g,"/")).then(function(r){return r.json()}).then(function(data){
    document.getElementById("vpath").textContent=path;
    document.getElementById("vcontent").textContent=data.content||"(empty)";
    document.getElementById("viewer").classList.add("open");
    // Also update preview
    document.getElementById("codepreview").style.display="block";
    document.getElementById("cp-hdr").textContent=path;
    document.getElementById("cp-code").textContent=data.content||"(empty)";
  });
}
function closeV(){document.getElementById("viewer").classList.remove("open");}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function showTab(tab){
  ["files","history","plugins"].forEach(function(t){
    var pane=document.getElementById("pane-"+t);
    var tabEl=document.getElementById("tab-"+t);
    if(pane)pane.style.display=t===tab?"flex":"none";
    if(tabEl)tabEl.className=t===tab?"tab active":"tab";
  });
  if(tab==="history")loadHistory();
  if(tab==="plugins")loadPlugins();
}
function loadHistory(){
  fetch("/api/runs").then(function(r){return r.json()}).then(function(data){
    var list=document.getElementById("hlist");list.innerHTML="";
    if(!data.runs||!data.runs.length){list.innerHTML='<div style="padding:12px;font-size:11px;color:var(--dim)">No runs yet</div>';return;}
    data.runs.forEach(function(run){
      var row=document.createElement("div");
      row.style.cssText="padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:11px";
      row.innerHTML='<div style="font-weight:500;margin-bottom:3px">'+esc((run.task||"").slice(0,80))+'</div><div style="color:var(--dim);font-size:10px">'+(run.verdict||run.status)+" | "+(run.task_type||"")+'</div>';
      list.appendChild(row);
    });
  });
}
function loadPlugins(){
  fetch("/api/plugins").then(function(r){return r.json()}).then(function(data){
    var list=document.getElementById("plist");list.innerHTML="";
    if(!data.plugins||!data.plugins.length){list.innerHTML='<div style="padding:12px;font-size:11px;color:var(--dim)">No plugins loaded</div>';return;}
    data.plugins.forEach(function(p){
      var row=document.createElement("div");
      row.style.cssText="padding:6px 10px;font-size:11px;border-bottom:1px solid var(--border)";
      row.innerHTML='<span style="font-weight:500">'+esc(p.name)+'</span> <span style="color:var(--dim);font-size:10px">'+p.agents+'</span>';
      list.appendChild(row);
    });
  });
}
function reloadPlugins(){fetch("/api/plugins/reload",{method:"POST"}).then(function(){loadPlugins()});}

// ── Util ─────────────────────────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(b){return b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";}
</script>
</body>
</html>
